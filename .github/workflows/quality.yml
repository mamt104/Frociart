name: Project preservation checks
on:
  push:
    branches: [main, codex/flowchart-quality]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  project-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified against official repository
        with:
          persist-credentials: false
      - name: Preserve project metadata and original bytes
        run: |
          node --version
          node tests/project-metadata.cjs
          node tests/project-original-bytes.cjs
          node tests/release-integrity.cjs
